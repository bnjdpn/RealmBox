name: macOS arm64

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  launcher:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: test "$(uname -m)" = "arm64"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.97.1 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm --dir apps/desktop tauri build --bundles app,dmg
      - run: file target/release/bundle/macos/RealmBox.app/Contents/MacOS/realmbox-desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RealmBox-macOS-arm64-unsigned
          path: target/release/bundle/
          if-no-files-found: error
