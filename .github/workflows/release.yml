name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag existant à reconstruire sans le déplacer
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  validate:
    runs-on: macos-15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Refuser un tag invalide
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Figer le commit du tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.97.1 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Set up Ruby for site release checks
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "4.0.6"
      - name: Verify the site release workflow
        run: |
          ruby .agents/skills/site-release-sync/scripts/check.rb --check
          ruby .agents/skills/site-release-sync/scripts/check_test.rb
      - name: Valider le tag de version
        shell: bash
        run: |
          cargo xtask release check --tag "$RELEASE_TAG"

  server-images:
    needs: validate
    uses: ./.github/workflows/server-images.yml
    with:
      source_ref: ${{ needs.validate.outputs.source_sha }}
      publish: true
      build_bundles: false

  image-lock:
    needs: [validate, server-images]
    runs-on: ubuntu-24.04
    env:
      REALMBOX_AUTH_SERVER_IMAGE: ${{ needs.server-images.outputs.authserver }}
      REALMBOX_WORLD_SERVER_IMAGE: ${{ needs.server-images.outputs.worldserver }}
      REALMBOX_DB_IMPORT_IMAGE: ${{ needs.server-images.outputs.db_import }}
      REALMBOX_TOOLS_IMAGE: ${{ needs.server-images.outputs.tools }}
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
    steps:
      - name: Refuser une release sans les quatre images immuables
        shell: bash
        run: |
          set -euo pipefail
          for name in REALMBOX_AUTH_SERVER_IMAGE REALMBOX_WORLD_SERVER_IMAGE REALMBOX_DB_IMPORT_IMAGE REALMBOX_TOOLS_IMAGE; do
            value="${!name:-}"
            if [[ ! "$value" =~ ^ghcr\.io/[a-z0-9._/:\-]+@sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::$name doit contenir une référence GHCR immuable"
              exit 1
            fi
            if [[ "$value" != *":rb-$SOURCE_SHA-$GITHUB_RUN_ID-"* ]]; then
              echo "::error::$name provient d’une autre source ou exécution"
              exit 1
            fi
            printf '%s=%s\n' "$name" "$value" >> release-images.env
          done
          printf '%s\n' "$SOURCE_SHA" > release-source.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-provenance
          path: |
            release-images.env
            release-source.txt
          if-no-files-found: error

  macos-arm64:
    needs: [validate, server-images, image-lock]
    runs-on: macos-15
    env:
      REALMBOX_AUTH_SERVER_IMAGE: ${{ needs.server-images.outputs.authserver }}
      REALMBOX_WORLD_SERVER_IMAGE: ${{ needs.server-images.outputs.worldserver }}
      REALMBOX_DB_IMPORT_IMAGE: ${{ needs.server-images.outputs.db_import }}
      REALMBOX_TOOLS_IMAGE: ${{ needs.server-images.outputs.tools }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - run: test "$(uname -m)" = "arm64"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.97.1 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop tauri build --bundles app,dmg
      - name: Vérifier le bundle macOS ad hoc
        shell: bash
        run: |
          set -euo pipefail
          test -d target/release/bundle/macos/RealmBox.app
          codesign --verify --deep --strict --verbose=2 target/release/bundle/macos/RealmBox.app
          file target/release/bundle/macos/RealmBox.app/Contents/MacOS/realmbox-desktop | grep -q 'arm64'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RealmBox-macOS-arm64-unsigned
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows-x64:
    needs: [validate, server-images, image-lock]
    runs-on: windows-2025
    env:
      REALMBOX_AUTH_SERVER_IMAGE: ${{ needs.server-images.outputs.authserver }}
      REALMBOX_WORLD_SERVER_IMAGE: ${{ needs.server-images.outputs.worldserver }}
      REALMBOX_DB_IMPORT_IMAGE: ${{ needs.server-images.outputs.db_import }}
      REALMBOX_TOOLS_IMAGE: ${{ needs.server-images.outputs.tools }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.97.1, targets: x86_64-pc-windows-msvc }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop tauri build --bundles nsis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RealmBox-Windows-x64-unsigned
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  launcher-screenshots:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm capture:launcher
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RealmBox-launcher-screenshots
          path: site/public/assets/launcher-*.webp
          if-no-files-found: error

  github-release:
    needs: [validate, macos-arm64, windows-x64, launcher-screenshots]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - name: Refuser un tag déplacé pendant la construction
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
      - name: Générer les sommes SHA-256
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f \( -name '*.dmg' -o -name '*.exe' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed -E 's#  dist/[^/]+/#  #' > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 2
      - name: Créer la prerelease brouillon
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            cat > release-notes.md <<EOF
          ## RealmBox $tag — préversion / preview

          Interface FR/EN, population Playerbots modifiable à chaud et diagnostic local séparé.

          - macOS Apple Silicon : parcours local réellement qualifié.
          - Windows x64 : installateur construit en CI, parcours complet Windows 11 non encore qualifié.
          - Artefacts sans signature de distribution et non notariés : vérifiez \`SHA256SUMS.txt\` avant ouverture.
          - Aucune donnée de jeu propriétaire n’est incluse. Une copie compatible build 12340 appartenant au joueur est requise.

          FR : https://bnjdpn.github.io/RealmBox/fr/
          EN: https://bnjdpn.github.io/RealmBox/en/
          EOF
            gh release create "$tag" --draft --prerelease --notes-file release-notes.md --title "RealmBox $tag"
          fi
          gh release upload "$tag" dist/RealmBox-macOS-arm64-unsigned/*.dmg dist/RealmBox-Windows-x64-unsigned/*.exe dist/RealmBox-launcher-screenshots/*.webp dist/release-provenance/* SHA256SUMS.txt --clobber
