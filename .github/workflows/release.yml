name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  REALMBOX_AUTH_SERVER_IMAGE: ${{ vars.REALMBOX_AUTH_SERVER_IMAGE }}
  REALMBOX_WORLD_SERVER_IMAGE: ${{ vars.REALMBOX_WORLD_SERVER_IMAGE }}
  REALMBOX_DB_IMPORT_IMAGE: ${{ vars.REALMBOX_DB_IMPORT_IMAGE }}
  REALMBOX_TOOLS_IMAGE: ${{ vars.REALMBOX_TOOLS_IMAGE }}

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.97.1 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Valider le tag de version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag de release invalide: $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Refuser une release sans les quatre images immuables
        shell: bash
        run: |
          set -euo pipefail
          for name in REALMBOX_AUTH_SERVER_IMAGE REALMBOX_WORLD_SERVER_IMAGE REALMBOX_DB_IMPORT_IMAGE REALMBOX_TOOLS_IMAGE; do
            value="${!name:-}"
            if [[ ! "$value" =~ ^ghcr\.io/[a-z0-9._/:\-]+@sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::$name doit contenir une référence GHCR immuable"
              exit 1
            fi
          done

  macos-arm64:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: test "$(uname -m)" = "arm64"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.97.1 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop tauri build --bundles dmg
      - name: Vérifier le bundle macOS ad hoc
        shell: bash
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 target/release/bundle/macos/RealmBox.app
          file target/release/bundle/macos/RealmBox.app/Contents/MacOS/realmbox-desktop | grep -q 'arm64'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RealmBox-macOS-arm64-unsigned
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows-x64:
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.97.1, targets: x86_64-pc-windows-msvc }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop tauri build --bundles nsis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RealmBox-Windows-x64-unsigned
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  github-release:
    needs: [macos-arm64, windows-x64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
      - name: Générer les sommes SHA-256
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f \( -name '*.dmg' -o -name '*.exe' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed -E 's#  dist/[^/]+/#  #' > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 2
      - name: Créer la prerelease brouillon
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            cat > release-notes.md <<EOF
          ## RealmBox $tag — préversion / preview

          Interface FR/EN, population Playerbots modifiable à chaud et diagnostic local séparé.

          - macOS Apple Silicon : parcours local réellement qualifié.
          - Windows x64 : installateur construit en CI, parcours complet Windows 11 non encore qualifié.
          - Artefacts sans signature de distribution et non notariés : vérifiez \`SHA256SUMS.txt\` avant ouverture.
          - Aucune donnée de jeu propriétaire n’est incluse. Une copie compatible build 12340 appartenant au joueur est requise.

          FR : https://bnjdpn.github.io/RealmBox/?lang=fr
          EN: https://bnjdpn.github.io/RealmBox/?lang=en
          EOF
            gh release create "$tag" --draft --prerelease --notes-file release-notes.md --title "RealmBox $tag"
          fi
          gh release upload "$tag" dist/RealmBox-macOS-arm64-unsigned/*.dmg dist/RealmBox-Windows-x64-unsigned/*.exe SHA256SUMS.txt --clobber
