name: Images serveur RealmBox

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publier les images par architecture dans GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  SERVER_COMMIT: 47960183bb03b83e8943eb2f0f39c16df9710c9d
  PLAYERBOTS_COMMIT: 2f7d9f774987d0157c6a0d0cc08c40bec3db3945
  OLLAMA_CHAT_COMMIT: a9d14b0b8955be136e657ac168dd255f5281a535

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: mod-playerbots/azerothcore-wotlk
          ref: ${{ env.SERVER_COMMIT }}
          path: upstream/server
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: mod-playerbots/mod-playerbots
          ref: ${{ env.PLAYERBOTS_COMMIT }}
          path: upstream/server/modules/mod-playerbots
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: DustinHendrickson/mod-ollama-chat
          ref: ${{ env.OLLAMA_CHAT_COMMIT }}
          path: upstream/server/modules/mod-ollama-chat
      - name: Appliquer le correctif de build borné
        run: node scripts/prepare-server-dockerfile.mjs upstream/server/apps/docker/Dockerfile
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire les quatre runtimes depuis les commits épinglés
        shell: bash
        working-directory: upstream/server
        env:
          PUBLISH: ${{ inputs.publish }}
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          output=--load
          if [[ "$PUBLISH" == "true" ]]; then output=--push; fi
          registry_root="ghcr.io/${REPOSITORY,,}"
          for target in authserver worldserver db-import tools; do
            docker buildx build \
              --platform "$PLATFORM" \
              --target "$target" \
              --build-arg REALMBOX_BUILD_JOBS=4 \
              --cache-from "type=gha,scope=server-$SUFFIX" \
              --cache-to "type=gha,mode=max,scope=server-$SUFFIX" \
              --tag "$registry_root/server-$target:$SERVER_COMMIT-$SUFFIX" \
              "$output" \
              --file apps/docker/Dockerfile .
          done

  manifest:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      authserver: ${{ steps.lock.outputs.REALMBOX_AUTH_SERVER_IMAGE }}
      worldserver: ${{ steps.lock.outputs.REALMBOX_WORLD_SERVER_IMAGE }}
      db_import: ${{ steps.lock.outputs.REALMBOX_DB_IMPORT_IMAGE }}
      tools: ${{ steps.lock.outputs.REALMBOX_TOOLS_IMAGE }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Créer les manifestes multiarchitecture immuables
        id: lock
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          registry_root="ghcr.io/${REPOSITORY,,}"
          : > server-images.env
          for target in authserver worldserver db-import tools; do
            destination="$registry_root/server-$target:$SERVER_COMMIT"
            docker buildx imagetools create \
              --tag "$destination" \
              "$registry_root/server-$target:$SERVER_COMMIT-linux-amd64" \
              "$registry_root/server-$target:$SERVER_COMMIT-linux-arm64"
            docker buildx imagetools inspect "$destination"
            digest="$(docker buildx imagetools inspect "$destination" --raw | sha256sum | cut -d ' ' -f 1)"
            case "$target" in
              authserver) variable=REALMBOX_AUTH_SERVER_IMAGE ;;
              worldserver) variable=REALMBOX_WORLD_SERVER_IMAGE ;;
              db-import) variable=REALMBOX_DB_IMPORT_IMAGE ;;
              tools) variable=REALMBOX_TOOLS_IMAGE ;;
            esac
            reference="$destination@sha256:$digest"
            printf '%s=%s\n' "$variable" "$reference" | tee -a server-images.env >> "$GITHUB_OUTPUT"
          done
      - name: Vérifier que les images sont accessibles sans compte
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io
          while IFS='=' read -r _ reference; do
            docker pull "$reference"
          done < server-images.env
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-images-lock
          path: server-images.env

  bundle-macos-arm64:
    if: inputs.publish
    needs: manifest
    runs-on: macos-15
    env:
      REALMBOX_AUTH_SERVER_IMAGE: ${{ needs.manifest.outputs.authserver }}
      REALMBOX_WORLD_SERVER_IMAGE: ${{ needs.manifest.outputs.worldserver }}
      REALMBOX_DB_IMPORT_IMAGE: ${{ needs.manifest.outputs.db_import }}
      REALMBOX_TOOLS_IMAGE: ${{ needs.manifest.outputs.tools }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: test "$(uname -m)" = "arm64"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.97.1 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm --dir apps/desktop tauri build --bundles app,dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RealmBox-macOS-arm64-prebuilt-unsigned
          path: target/release/bundle/
          if-no-files-found: error

  bundle-windows-x64:
    if: inputs.publish
    needs: manifest
    runs-on: windows-2025
    env:
      REALMBOX_AUTH_SERVER_IMAGE: ${{ needs.manifest.outputs.authserver }}
      REALMBOX_WORLD_SERVER_IMAGE: ${{ needs.manifest.outputs.worldserver }}
      REALMBOX_DB_IMPORT_IMAGE: ${{ needs.manifest.outputs.db_import }}
      REALMBOX_TOOLS_IMAGE: ${{ needs.manifest.outputs.tools }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with: { toolchain: 1.97.1, targets: x86_64-pc-windows-msvc }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm --dir apps/desktop tauri build --bundles nsis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RealmBox-Windows-x64-prebuilt-unsigned
          path: target/release/bundle/nsis/
          if-no-files-found: error
