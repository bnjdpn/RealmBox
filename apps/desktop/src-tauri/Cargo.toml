[package]
name = "realmbox-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "realmbox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
realmbox-client = { path = "../../../crates/realmbox-client" }
realmbox-domain = { path = "../../../crates/realmbox-domain" }
realmbox-orchestrator = { path = "../../../crates/realmbox-orchestrator" }
realmbox-storage = { path = "../../../crates/realmbox-storage" }
serde.workspace = true
tauri = { version = "2.8", features = [] }

