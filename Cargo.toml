[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/realmbox-domain",
  "crates/realmbox-storage",
  "crates/realmbox-client",
  "crates/realmbox-config",
  "crates/realmbox-orchestrator",
  "crates/realmbox-runtime",
  "crates/realmbox-test-support",
  "tools/xtask",
]

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
toml = "0.9"
